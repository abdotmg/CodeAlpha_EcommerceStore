  <title>ShopZone | Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="logo">ShopZone</div>
    <div class="nav-links">

  <section class="products-section">

      <p>Don't have an account? <a href="signup.html">Signup</a></p>
    </div>
  </section>

  <script src="script.js"></script>
